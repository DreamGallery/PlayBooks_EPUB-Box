[project]
name = "playbooks-epub-box"
version = "0.1.1"
description = "将 Google Play 图书高清原始插图匹配并替换到 EPUB，无需安装 ADE 或 Calibre。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
    "cryptography>=41.0",
    "websocket-client>=1.6",
    "lxml>=5.0",
    "pycryptodome>=3.20",
    "flet[desktop]==1.0.0",
    "Send2Trash>=1.8.3,<2",
]

[project.urls]
Homepage = "https://github.com/DreamGallery/PlayBooks_EPUB-Box"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playbooks"]
